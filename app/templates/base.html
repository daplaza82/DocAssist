<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAssist Academic - {% block title %}{% endblock %}</title>
    
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Estilos personalizados -->
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-gray-800 hover:text-blue-600 transition-colors">
                        DocAssist Academic
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container mx-auto px-4 py-8">
        <!-- Contenedor de alertas -->
        <div id="alert-container" class="hidden fixed top-4 right-4 max-w-sm w-full">
            <div class="relative p-4 rounded-lg shadow-lg border-l-4 transform transition-all duration-500 ease-in-out">
                <div class="flex items-center space-x-3">
                    <div class="alert-icon flex-shrink-0">
                        <!-- El ícono se ajustará según el tipo de alerta -->
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p id="alert-message" class="text-sm font-medium"></p>
                    </div>
                </div>
            </div>
        </div>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow-lg mt-8 fixed bottom-0 w-full">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <p class="text-center text-gray-600">
                DocAssist Academic © 2025 - Todos los derechos reservados
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
